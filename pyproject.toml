[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ab_testing"
version = "1.0.0"
description = "Statistically rigorous A/B test analysis toolkit: power analysis, hypothesis testing, segmentation diagnostics, and logistic regression."
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "scipy>=1.10",
    "statsmodels>=0.14",
    "matplotlib>=3.7",
    "seaborn>=0.12",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "nbformat>=5.9", "nbclient>=0.9", "ipykernel>=6.0"]

[tool.setuptools.packages.find]
where = ["src"]
